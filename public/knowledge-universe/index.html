<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <meta name="description" content="一个可以离线探索、自由扩展的个人知识宇宙。股市、心理学、哲学、宇宙天文学、数学和物理，在这里相连。">
  <title>知识宇宙 · LifeAtlas</title>
  <script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.dataset.embedded="true";</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310151f'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%237dcce8'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='6' transform='rotate(-35 16 16)' fill='none' stroke='%237dcce8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="embedded.css">
  <link rel="stylesheet" href="nebula.css">
  <script src="vendor/three-runtime.min.js" defer></script>
  <script src="nebula-field.js" defer></script>
  <script src="universe3d.js" defer></script>
  <script src="knowledge.js" defer></script>
  <script src="cosmic-background.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#reader">跳到阅读面板</a>
  <header class="topbar">
    <button class="brand" id="home" aria-label="回到知识宇宙首页"><svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="5"/><ellipse cx="20" cy="20" rx="18" ry="8" transform="rotate(-38 20 20)"/><path d="M20 2v7m0 22v7"/></svg><span>知识宇宙<small>ATLAS / 本地知识库</small></span></button>
    <div class="search-wrap">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" placeholder="搜索知识、问题或关键词…" aria-label="搜索知识节点" aria-controls="search-results" aria-expanded="false" role="combobox">
      <kbd>/</kbd>
      <div id="search-results" class="search-results" role="listbox" hidden></div>
    </div>
    <div class="top-actions"><span class="local-status"><i></i>本地宇宙</span><button class="icon-button" id="help" aria-label="使用指南" title="使用指南"><svg class="icon"><use href="#i-help"/></svg></button><button class="button primary small" id="add-node"><svg class="icon"><use href="#i-plus"/></svg><span>添加知识</span></button></div>
  </header>

  <aside class="sidebar" aria-label="宇宙导航">
    <div class="nav-section"><p class="nav-heading">探索</p><button class="nav-item active" id="all-domains" data-domain="all"><svg class="icon"><use href="#i-orbit"/></svg><span>全部星系</span><small id="total-count">90</small></button><div id="domain-nav"></div></div>
    <div class="nav-section"><p class="nav-heading">我的轨迹</p><button class="nav-item" id="show-routes"><svg class="icon"><use href="#i-route"/></svg><span>学习路线</span><small>7</small></button><button class="nav-item" id="show-favorites"><svg class="icon"><use href="#i-bookmark"/></svg><span>我的收藏</span><small id="favorite-count">0</small></button><button class="nav-item" id="show-learned"><svg class="icon"><use href="#i-check"/></svg><span>已经探索</span><small id="learned-count">0</small></button></div>
    <div class="sidebar-bottom"><div class="local-copy"><svg class="icon"><use href="#i-device"/></svg><span>让好奇心，有迹可循。<small>笔记与轨迹保存在此浏览器</small></span></div><div class="backup-actions"><button id="export-data"><svg class="icon"><use href="#i-download"/></svg>导出备份</button><button id="import-data"><svg class="icon"><use href="#i-upload"/></svg>导入</button></div></div>
  </aside>

  <main class="workspace" id="workspace">
    <div class="map-heading"><div><h1 id="map-title">知识星云</h1><p id="map-description">自由翻转，走进知识的深处。</p></div><div class="view-switch" aria-label="知识展示方式"><button id="map-view" class="selected" aria-pressed="true"><svg class="icon"><use href="#i-orbit"/></svg>星云</button><button id="list-view" aria-pressed="false"><svg class="icon"><use href="#i-list"/></svg>层级目录</button></div></div>
    <div class="hierarchy-toolbar"><button id="up-level" class="button small" disabled>上一层</button><nav id="hierarchy-path" aria-label="当前包含层级"></nav></div>
    <div class="universe-options"><span id="level-count">宇宙总览</span><label><input id="show-bridges" type="checkbox" checked>跨系联系</label><label><input id="auto-orbit" type="checkbox" checked>缓慢自转</label></div>
    <div id="webgl-status" role="status">正在构建3D宇宙…</div>
    <div id="graph" role="img" aria-label="三维分层知识宇宙。左键旋转、滚轮缩放、右键平移；点击框架逐层进入；搜索和层级目录支持键盘。"></div>
    <div class="map-bottom"><div class="map-caption"><span id="map-count">113 个节点 · 多层包含与跨系联系</span><small>拖动翻转 · 滚轮穿行 · 点击恒星深入</small></div><div class="map-controls"><button id="toggle-reading" class="icon-button" title="显示或收起阅读" aria-label="显示或收起阅读">
<svg class="icon"><use href="#i-list"/></svg></button><button id="zoom-out" class="icon-button" title="缩小" aria-label="缩小"><svg class="icon"><use href="#i-minus"/></svg></button><button id="reset-map" class="icon-button" title="查看全景" aria-label="查看全景"><svg class="icon"><use href="#i-fit"/></svg></button><button id="zoom-in" class="icon-button" title="放大" aria-label="放大"><svg class="icon"><use href="#i-plus"/></svg></button></div></div>
    <section id="catalog" class="catalog" aria-label="知识目录" hidden></section>
    <div class="graph-tooltip" id="graph-tooltip" hidden></div>
  </main>

  <aside class="reader" id="reader" aria-label="知识阅读面板" tabindex="-1"><div id="reader-content"></div></aside>
  <button id="mobile-reader" class="mobile-reader" aria-expanded="false">展开阅读面板<svg class="icon"><use href="#i-arrow"/></svg></button>

  <dialog id="node-dialog" aria-labelledby="node-dialog-title">
    <form id="node-form">
      <div class="dialog-heading"><h2 id="node-dialog-title">点亮一颗新星</h2><button type="button" id="close-dialog" class="icon-button" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <p class="muted">把你的理解放进宇宙，和已有知识连接起来。</p>
      <label>知识名称<input name="title" required maxlength="80" placeholder="例如：我的决策检查清单"></label>
      <label>所属星系<select name="domain" id="node-domain"></select></label>
      <label>父级框架<select name="parent" id="node-parent"></select></label>
      <label>一句话理解<input name="summary" required maxlength="300" placeholder="用自己的话说明，它是什么？"></label>
      <label>详细内容<textarea name="detail" rows="4" maxlength="8000" placeholder="解释、例子、问题，或你的思考…"></textarea></label>
      <label>连接到哪些知识<select name="related" id="node-related" multiple size="4"></select><small>按住 Ctrl 可多选；手机可直接选择多项。</small></label>
      <label>参考链接（选填）<input name="url" type="url" placeholder="https://…" maxlength="1200"></label>
      <p class="form-error" id="form-error" role="alert"></p>
      <button type="submit" class="button primary">保存到我的宇宙<svg class="icon"><use href="#i-arrow"/></svg></button>
    </form>
  </dialog>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><ellipse cx="12" cy="12" rx="11" ry="5" transform="rotate(-35 12 12)"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 5h8a4 4 0 0 1 0 8H9a3 3 0 0 0 0 6h8"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m6 0h6v-6"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .7-1.5 1-1.5 3m0 3h.1"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M4 16v5h16v-5"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/></symbol>
  </svg>
</body>
</html>
